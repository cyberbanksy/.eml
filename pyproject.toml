[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doteml"
version = "0.1.0"
description = "Convert .eml email files to PDF, PNG, JPG, or HTML"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "doteml contributors" }]
keywords = ["email", "eml", "pdf", "png", "jpg", "converter", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "pypdf>=4.0",
]

[project.scripts]
doteml = "doteml.cli:cli"
eml2pdf = "doteml.cli:cli_pdf"
eml2png = "doteml.cli:cli_png"
eml2jpg = "doteml.cli:cli_jpg"
eml2html = "doteml.cli:cli_html"

[project.urls]
Homepage = "https://github.com/cyberbanksy/.eml"
Repository = "https://github.com/cyberbanksy/.eml"
Issues = "https://github.com/cyberbanksy/.eml/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/doteml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
