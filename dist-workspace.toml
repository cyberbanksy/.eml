[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# The Homebrew formula lives in this repo (Formula/doteml.rb)
tap = "cyberbanksy/.eml"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# release.yml is hand-adjusted for a same-repo tap (checkout ref + token); see CONTRIBUTING.md
allow-dirty = ["ci"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Build provenance (SLSA) attestations for every release artifact
github-attestations = true
# Embed the dependency tree in each binary (readable by `cargo audit bin`)
cargo-auditable = true
# Publish a CycloneDX SBOM alongside each release
cargo-cyclonedx = true
# Sign macOS binaries with a Developer ID certificate when the CODESIGN_* secrets are set
macos-sign = true

# GitHub no longer runs macos-14 jobs; dist 0.32 still defaults Apple Silicon builds to it
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
