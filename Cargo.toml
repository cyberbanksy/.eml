[package]
name = "doteml"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Convert .eml email files to PDF, PNG, JPG, or HTML"
license = "MIT"
repository = "https://github.com/cyberbanksy/.eml"
authors = ["cyberbanksy"]
keywords = ["email", "eml", "pdf", "converter", "cli"]
categories = ["command-line-utilities", "email"]
default-run = "doteml"
# What ships to crates.io: the sources and docs, not CI, packaging or test fixtures
include = ["src/**", "LICENSE", "README.md", "CHANGELOG.md"]

[package.metadata.wix]
upgrade-guid = "896A0C9D-EEA3-45B8-98FE-8CD1C5CD8760"
path-guid = "9C5E3D7B-8765-4EC1-8373-AD4D216325D7"
license = false
eula = false

[[bin]]
name = "doteml"
path = "src/main.rs"

[dependencies]
mail-parser = "=0.11.9"
lopdf = "0.47.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
serde_json = "1.0.154"
serde = { version = "1", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help", "env"] }
sha2 = "0.11.1"
base64 = "0.23.1"
tempfile = "3.27.0"
regex = "1.13.1"
thiserror = "2"
plist = "1.10.3"
which = "8"
dirs = "7"
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
png = "0.18.1"
predicates = "3"
tiny_http = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSData", "NSDate", "NSDictionary", "NSError", "NSGeometry", "NSObject",
    "NSProcessInfo", "NSRunLoop", "NSString", "NSURL", "NSURLRequest", "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "objc2-core-foundation", "NSApplication", "NSBitmapImageRep", "NSGraphics", "NSImage", "NSImageRep",
    "NSResponder", "NSRunningApplication", "NSView",
    "NSWindow",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKContentRuleList",
    "WKContentRuleListStore", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate",
    "WKPDFConfiguration", "WKSnapshotConfiguration", "WKUserContentController", "WKWebView",
    "WKWebViewConfiguration", "WKWebpagePreferences", "WKWebsiteDataStore",
] }
